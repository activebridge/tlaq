{% assign li = site.data.leasing-inquiry %}
<dialog id="leasingInquiryDialog" class="inquiry-form" aria-labelledby="leasingInquiryTitle"
  data-type="leasing"
  data-trigger="leasingInquiryTrigger"
  data-date-input="leaseMoveInDate"
  data-success="{{ li.success | escape }}"
  data-error="{{ li.error | escape }}">
  <button type="button" class="dialog-close" aria-label="Close" onclick="this.closest('dialog').close()">✕</button>
  <article>
    <h5 id="leasingInquiryTitle">{{ li.title }}</h5>
    <h6>{{ li.description }}</h6>
    <form id="leasingInquiryForm">
      <label for="lease-first-name">
        {{ li.form_placeholders.first_name }} *
        <input type="text" name="first-name" id="lease-first-name" required>
      </label>
      <label for="lease-last-name">
        {{ li.form_placeholders.last_name }} *
        <input type="text" name="last-name" id="lease-last-name" required>
      </label>
      <label for="lease-company">
        {{ li.form_placeholders.company }} *
        <input type="text" name="company" id="lease-company" required>
      </label>
      <label for="lease-role">
        {{ li.form_placeholders.role }} *
        <input type="text" name="role" id="lease-role" required>
      </label>
      <label for="lease-phone">
        {{ li.form_placeholders.phone }} *
        <input type="tel" name="phone" id="lease-phone" pattern="[0-9+\-\s()]{7,}" title="Please enter a valid phone number" inputmode="tel" required>
      </label>
      <label for="lease-email">
        {{ li.form_placeholders.email }} *
        <input type="email" name="email" id="lease-email" required>
      </label>
      <label for="lease-size">
        {{ li.form_placeholders.size_sqft }} *
        <input type="number" name="size_sqft" id="lease-size" min="1" title="Please enter a valid square footage" required>
      </label>
      <label for="lease-move-in">
        {{ li.form_placeholders.move_in_date }} *
        <input type="date" name="move_in_date" id="leaseMoveInDate" required>
      </label>
      <button id="leaseSubmitBtn" class="btn btn-primary" type="submit">
        {{ li.submit_button }}
      </button>
      <p id="leaseConnectMsg" class="form-message" role="status" aria-live="polite" aria-hidden="true"></p>
    </form>
    <button data-reset type="button" class="btn btn-primary" style="display:none">{{ li.reset }}</button>
  </article>
</dialog>

<script src="{{ '/assets/js/inquiry-form.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
