<head>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="application-name" content="{{ site.data.site.app_name }}">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111c4e">
  <meta name="color-scheme" content="dark">

  {% include style.html %}

  {% seo %}
  {% if page.url == "/" %}{% include schema-local-business.html %}{% endif %}

  <link rel="icon" href="{{ '/favicon-v2.ico' | relative_url }}" sizes="any">
  <link rel="icon" href="{{ '/favicon-32x32.png' | relative_url }}" sizes="32x32" type="image/png">
  <link rel="icon" href="{{ '/favicon-16x16.png' | relative_url }}" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="{{ '/favicon-apple-touch.png' | relative_url }}">
  <link rel="manifest" href="{{ '/manifest.json' | relative_url }}">

  <link rel="preload" as="image"
    href="{{ site.cdn_url }}/cdn-cgi/image/width=347,height=72,fit=contain,quality=55/assets/images/logos/main.webp"
    imagesrcset="{{ site.cdn_url }}/cdn-cgi/image/width=247,height=51,fit=contain,quality=55/assets/images/logos/main.webp 247w,
                 {{ site.cdn_url }}/cdn-cgi/image/width=347,height=72,fit=contain,quality=55/assets/images/logos/main.webp 347w"
    imagesizes="(max-width: 770px) 247px, 347px"
    fetchpriority="high">

  <link rel="preload" href="{{ '/assets/fonts/Montserrat-Regular.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/Montserrat-Medium.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/Montserrat-SemiBold.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/BigCaslon-Medium.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="{{ '/assets/css/application.css' | relative_url }}?v={{ site.time | date: '%s' }}" media="print" onload="this.media='all'">

  <noscript>
    <link rel="stylesheet" href="{{ '/assets/css/application.css' | relative_url }}">
  </noscript>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5B8EH7YDPN"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-5B8EH7YDPN');
  </script>
  <script>function imageError(img) { img.onerror = null; img.srcset = ''; var p = img.parentElement; if (p && p.tagName === 'PICTURE') { p.querySelectorAll('source').forEach(function(s) { s.srcset = ''; }); } img.src = '/assets/images/placeholder.webp'; }</script>
</head>
