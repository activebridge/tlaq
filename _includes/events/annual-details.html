{% if include.event.schedule %}
  <h3>Schedule</h3>
  <hr>
  {% for venue in include.event.schedule %}
    <h6>{{ venue.location | upcase }}</h6>
    {% for performance in venue.performances %}
      <p class="schedule-item">
        <span>{{ performance.name }}</span>
        <span>{{ performance.time }}</span>
      </p>
    {% endfor %}
    <hr>
  {% endfor %}
{% endif %}
