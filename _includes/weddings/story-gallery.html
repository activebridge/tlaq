{% assign gallery = include.images | default: page.gallery %}
{% if gallery and gallery.size > 0 %}
<div id="story-gallery">
  {% for item in gallery %}
  {% assign src = item.image | default: item %}
  <figure>
    <button type="button" onclick="heroImg.src = this.dataset.hi"
            data-hi="{{ src | prepend: '/cdn-cgi/image/width=1600,height=1200,fit=cover,quality=85,gravity=center,format=webp/' | prepend: site.cdn_url }}">
      <picture>
        <source media="(max-width: 480px)" srcset="{{ src | prepend: '/cdn-cgi/image/width=310,height=260,fit=cover,format=webp/' | prepend: site.cdn_url }}">
        <source media="(min-width: 768px)" srcset="{{ src | prepend: '/cdn-cgi/image/width=620,height=520,fit=cover,format=webp/' | prepend: site.cdn_url }}">
        <img src="{{ src | prepend: '/cdn-cgi/image/width=620,height=520,fit=cover,format=webp/' | prepend: site.cdn_url }}"
             alt="{{ item.alt | default: '' }}" loading="lazy" decoding="async" onerror="imageError(this)">
      </picture>
    </button>
  </figure>
  {% endfor %}

  {% for item in gallery %}
  {% assign src = item.image | default: item %}
  <img src="{{ src | prepend: '/cdn-cgi/image/width=1600,height=1200,fit=cover,quality=85,gravity=center,format=webp/' | prepend: site.cdn_url }}"
       alt="" aria-hidden="true" fetchpriority="low" decoding="async">
  {% endfor %}
</div>
{% endif %}
