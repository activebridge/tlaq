<style>
  @view-transition { navigation: auto; }

  ::view-transition-old(*),
  ::view-transition-new(*) {
    mix-blend-mode: normal;
  }

  ::view-transition-group(*) {
    animation-duration: 300ms;
  }

  .btn { text-transform: uppercase; }

  :root {
    /* Header */
    --header-height: 71px;
    --header-status-height: 33px;
    --banner-top: 158px;
    --header-nav-height: 25px;
    --layout-max-width: 1440px;
    --font-montserrat: "Montserrat", "Montserrat Fallback", sans-serif;
    --font-caslon: "Big Caslon", "Big Caslon Fallback", serif;

    /* Color palette */
    --navy: #111c4e;
    --navy-80: color-mix(in srgb, var(--navy) 80%, transparent);
    --navy-60: color-mix(in srgb, var(--navy) 60%, transparent);
    --navy-40: color-mix(in srgb, var(--navy) 40%, transparent);
    --cream: #f7ead7;
    --cream-80: color-mix(in srgb, var(--cream) 80%, transparent);
    --cream-60: color-mix(in srgb, var(--cream) 60%, transparent);
    --cream-40: color-mix(in srgb, var(--cream) 40%, transparent);
    --red: #e64b38;
    --red-80: color-mix(in srgb, var(--red) 80%, transparent);
    --red-60: color-mix(in srgb, var(--red) 60%, transparent);
    --red-40: color-mix(in srgb, var(--red) 40%, transparent);
    --orange: #f88d2b;
    --orange-80: color-mix(in srgb, var(--orange) 80%, transparent);
    --orange-60: color-mix(in srgb, var(--orange) 60%, transparent);
    --orange-40: color-mix(in srgb, var(--orange) 40%, transparent);
    --green: #008066;
    --green-80: color-mix(in srgb, var(--green) 80%, transparent);
    --green-60: color-mix(in srgb, var(--green) 60%, transparent);
    --green-40: color-mix(in srgb, var(--green) 40%, transparent);
    --blue: #1b638a;
    --blue-80: color-mix(in srgb, var(--blue) 80%, transparent);
    --blue-60: color-mix(in srgb, var(--blue) 60%, transparent);
    --blue-40: color-mix(in srgb, var(--blue) 40%, transparent);
    --pink: #d41367;
    --pink-80: color-mix(in srgb, var(--pink) 80%, transparent);
    --pink-60: color-mix(in srgb, var(--pink) 60%, transparent);
    --pink-40: color-mix(in srgb, var(--pink) 40%, transparent);
    --pink-light: #f291a6;
    --purple: #9926b7;
    --purple-light: #e4c3d2;
    --purple-80: color-mix(in srgb, var(--purple) 80%, transparent);
    --purple-60: color-mix(in srgb, var(--purple) 60%, transparent);
    --purple-40: color-mix(in srgb, var(--purple) 40%, transparent);
    --gray: #D9D9D9;
    --placeholder-bg: #e8e4df;

    /* Utility colors */
    --primary: var(--navy);
    --secondary: var(--cream);
    --bg: var(--secondary);
    --text: var(--primary);
    --secondary-text: var(--secondary);

    @media (max-width: 770px) { --banner-top: 116px; }
  }

  html {
    background: var(--primary);
    scroll-padding-top: calc(var(--header-height) + var(--header-status-height) + 7rem);

    @media (max-width: 770px) {
      scroll-padding-top: calc(var(--header-height) - var(--header-nav-height) + var(--header-status-height) + 1.5rem);
    }
  }

  @font-face {
    font-family: "Montserrat";
    font-style: normal;
    font-weight: 400;
    src: url("/assets/fonts/Montserrat-Regular.woff2") format("woff2");
    font-display: swap;
  }

  @font-face {
    font-family: "Montserrat";
    font-style: normal;
    font-weight: 500;
    src: url("/assets/fonts/Montserrat-Medium.woff2") format("woff2");
    font-display: swap;
  }

  @font-face {
    font-family: "Montserrat";
    font-style: normal;
    font-weight: 600;
    src: url("/assets/fonts/Montserrat-SemiBold.woff2") format("woff2");
    font-display: swap;
  }

  @font-face {
    font-family: "Big Caslon";
    font-style: normal;
    font-weight: 500;
    src: url("/assets/fonts/BigCaslon-Medium.woff2") format("woff2");
    font-display: swap;
  }

  @font-face {
    font-family: "Montserrat Fallback";
    font-weight: 400;
    src: local("SF Pro Text"), local("SF Pro Display"), local("Segoe UI"), local("Roboto"), local("Oxygen-Sans"), local("Ubuntu"), local("Cantarell"), local("Helvetica Neue");
    size-adjust: 107.2%;
  }

  @font-face {
    font-family: "Montserrat Fallback";
    font-weight: 500;
    src: local("SF Pro Text"), local("SF Pro Display"), local("Segoe UI"), local("Roboto"), local("Oxygen-Sans"), local("Ubuntu"), local("Cantarell"), local("Helvetica Neue");
    size-adjust: 107.2%;
  }

  @font-face {
    font-family: "Big Caslon Fallback";
    font-weight: 400;
    src: local("Book Antiqua"), local("Palatino Linotype"), local("Georgia"), local("Times New Roman");
    size-adjust: 95%;
  }

html, body {
    height: 100%;
    margin: 0;
    color: var(--text);
    font-family: var(--font-montserrat);
    font-weight: 400;
    font-size: 12px;
    scroll-behavior: smooth;
  }

  body {
    display: flex;
    flex-direction: column;
    background: var(--primary);
    min-height: 100%;
    height: auto;

    &:has(:popover-open) { overflow-y: hidden; }
  }

  main {
    flex-grow: 1;
    background: var(--cream);
  }

  svg {
    display: inline-block;
    vertical-align: middle;
    width: auto;
  }

  button {
    color: inherit;
  }

  a {
    color: inherit;
    text-decoration-color: transparent;
    text-decoration-thickness: 1px;
    text-underline-offset: 0px;
    -webkit-tap-highlight-color: transparent;
    transition: text-decoration-color 0.3s, text-underline-offset 0.3s;
  }

  a:hover {
    text-underline-offset: 2px;
    text-decoration-color: inherit;
  }

  /* Critical CSS – CSS reset, typography sizes, header layout, container, landing banner.
     Prevents layout shifts while application.css loads async. */

  @media (prefers-reduced-motion: no-preference) {
    html { interpolate-size: allow-keywords; }
  }

  *, *::before, *::after { box-sizing: border-box; }
  *:not(dialog) { margin: 0; }

  body {
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  img, picture, video, canvas {
    display: block;
    max-width: 100%;
    width: 100%;
  }

  input, button, textarea, select { font: inherit; }

  p, h1, h2, h3, h4, h5, h6 { overflow-wrap: break-word; }
  h1, h2, h3, h4, h5, h6 { text-wrap: auto; }

  h1, h2, h3, h4 {
    font-family: var(--font-caslon);
    font-weight: 500;
    line-height: 1.15;
    letter-spacing: 0.04em;
  }

  h1 { font-size: clamp(45px, 6vw, 90px); }
  h2 { font-size: clamp(28px, 3vw, 45px); }
  h3 { font-size: clamp(24px, 3vw, 35px); }
  h4 { font-size: clamp(18px, 3vw, 34px); }

  h5, h6 {
    font-family: var(--font-montserrat);
    line-height: 1;
  }

  h5 { font-size: clamp(20px, 1.5vw, 24px); text-transform: uppercase; }

  h6 {
    font-size: clamp(12px, 1.3vw, 18px);
    line-height: clamp(20px, 2.5vw, 25px);
  }

  p { font-size: clamp(12px, 1.7vw, 20px); }

  ul {
    font-family: var(--font-montserrat);
    font-size: clamp(12px, 1.7vw, 20px);
    line-height: clamp(20px, 2.5vw, 40px);
  }

  .container {
    padding: 0 20px;
    display: grid;
  }

  header {
    position: sticky;
    top: 0;
    background: var(--navy);
    color: var(--cream);
    z-index: 10;
    width: 100%;
    anchor-name: --header;
    view-transition-name: header;

    .nav-icon {
      width: 16px;
      height: 16px;
      margin-right: 1rem;
      display: inline-block;
      flex: 0 0 auto;
      fill: currentColor;
      stroke: none;
    }

    > .wrapper {
      width: 100%;
      max-width: 1440px;
      margin-inline: auto;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
    }
  }

  @media (min-width: 771px) {
    :active-view-transition { body { background: var(--cream); } }
  }

  @keyframes header-vt-pos-out {
    from {
      object-position: top center;
    }
    to {
      object-position: center center;
    }
  }

  @keyframes header-vt-pos-in {
    from {
      object-position: bottom center;
    }
    to {
      object-position: center center;
    }
  }

  ::view-transition-group(header) {
    z-index: 2;
    animation-duration: 500ms;
    animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
  }

  ::view-transition-old(header) {
    width: 100%;
    height: 100%;
    object-position: top center;
    animation: header-vt-pos-out 500ms cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  ::view-transition-new(header) {
    width: 100%;
    height: 100%;
    object-position: bottom center;
    animation: header-vt-pos-in 500ms cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  ::view-transition-group(visit-popover),
  ::view-transition-group(about-popover),
  ::view-transition-group(discover-popover),
  ::view-transition-old(visit-popover),
  ::view-transition-old(about-popover),
  ::view-transition-old(discover-popover),
  ::view-transition-new(visit-popover),
  ::view-transition-new(about-popover),
  ::view-transition-new(discover-popover) {
    animation: none;
    display: none;
  }

  header a {
    text-decoration: none;
    color: inherit;
  }

  header a.logo {
    grid-column: 1;
    grid-row: 1;
    display: flex;
    align-items: center;
    justify-self: start;
    margin: 1rem 0 2rem 2rem;
    outline: none;
    width: clamp(180px, 18vw, 280px);
    user-select: none;
    -webkit-user-select: none;

    &:active, &:focus-visible {
      outline: none;
    }
  }

  header a.logo img {
    display: block;
    width: 280px;
    height: auto;
    min-width: 180px;
    object-fit: contain;
  }

  header ul.header-actions {
    grid-column: 3;
    grid-row: 1;
    display: flex;
    list-style: none;
    padding: 0;
    margin: -15px 2rem 1rem 0;
    gap: 0.5rem;
    align-items: center;
    justify-self: end;
    user-select: none;
    -webkit-user-select: none;

    li { display: inline-flex; }

    a, button {
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--cream);
      padding: 0;
      display: inline-flex;
      align-items: center;

      &:focus { outline: none; }
      &:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 2px;
        border-radius: 2px;
      }
    }

    svg { width: 22px; height: 22px; }
  }

  header button.nav-toggle {
    display: none;
    user-select: none;
    -webkit-user-select: none;
  }

  header nav#desktop {
    grid-column: 2;
    grid-row: 1;
    position: relative;
    user-select: none;
    -webkit-user-select: none;

    a.nav-weddings {
      color: var(--pink-light);

      &::after { background: var(--pink-light); }
    }

    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    align-items: center;
    column-gap: 1rem;
    row-gap: 0;
    text-transform: uppercase;
    margin: -5px 0 2rem 3rem;

    a,
    button#visit-popover-anchor,
    button#about-popover-anchor,
    button#discover-popover-anchor {
      cursor: pointer;
      color: var(--cream);
      font-size: clamp(11px, 1.1vw, 15px);
      font-weight: 600;
      letter-spacing: 0.05em;
      background: transparent;
      display: inline-flex;
      gap: 0.6rem;
      padding: 0 0.35rem;
      align-items: center;
      text-transform: uppercase;
      flex-direction: row;
      height: 100%;
      white-space: nowrap;
    }

    a {
      padding: 0.75rem 0.35rem;
      position: relative;

      svg:first-of-type {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
      }
    }

    button.nav-popover-anchor {
      all: unset;
      height: 100%;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: clamp(11px, 1.1vw, 15px);
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      white-space: nowrap;
      color: var(--cream);

      svg:first-of-type {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
      }

      svg:last-of-type {
        fill: var(--cream);
        transition: transform 500ms ease;
      }
    }

    button#visit-popover-anchor {
      anchor-name: --visit-popover-anchor;
    }

    button#about-popover-anchor {
      anchor-name: --about-popover-anchor;
    }

    button#discover-popover-anchor {
      anchor-name: --discover-popover-anchor;
    }

    div.nav-popover {
      position: absolute;
      border: none;
      background: var(--navy);
      color: var(--cream);
      z-index: 10;
      display: flex;
      flex-direction: column;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translate(-50%, -8px);
      transition: opacity 300ms ease, transform 300ms ease, visibility 0s linear 300ms;

      a {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        flex-direction: row;
        width: 100%;
        padding: 8px 5px;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 400;
        font-size: 15px;
        color: var(--cream);
        border-bottom: 1px solid var(--cream);
        transition: background-color 180ms ease, color 180ms ease;
        height: auto;
        white-space: nowrap;

        &::after { display: none; }
        &:first-child { border-top: none; }
        &:last-child { border-bottom: none; }

        &:hover {
          background: var(--cream);
          color: var(--navy);
        }
      }
    }

    div#visit-popover {
      top: anchor(--visit-popover-anchor bottom);
      left: anchor(--visit-popover-anchor center);
      view-transition-name: visit-popover;
    }

    div#about-popover {
      top: anchor(--about-popover-anchor bottom);
      left: anchor(--about-popover-anchor center);
      view-transition-name: about-popover;
    }

    div#discover-popover {
      top: anchor(--discover-popover-anchor bottom);
      left: anchor(--discover-popover-anchor center);
      view-transition-name: discover-popover;
    }

    .nav-popover-anchor:hover + .nav-popover,
    .nav-popover-anchor:focus-visible + .nav-popover {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translate(-50%, 0);
      transition: opacity 300ms ease, transform 300ms ease, visibility 0s linear 0s;
    }

    .nav-popover:hover,
    .nav-popover:focus-within {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translate(-50%, 0);
      transition: opacity 300ms ease, transform 300ms ease, visibility 0s linear 0s;
    }

    .nav-popover-anchor:hover svg:last-of-type,
    .nav-popover-anchor:focus-visible svg:last-of-type {
      transform: rotate(180deg);
    }

    &:has(.nav-popover:hover) .nav-popover-anchor:has(+ .nav-popover:hover) svg:last-of-type,
    &:has(.nav-popover:focus-within) .nav-popover-anchor:has(+ .nav-popover:focus-within) svg:last-of-type {
      transform: rotate(180deg);
    }
  }

  aside#status {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    align-content: center;
    background: var(--cream);
    color: var(--navy);
    padding: 0.45rem 1rem;
    height: var(--header-status-height);
    font-size: clamp(12px, 1.7vw, 15px);
    font-weight: 500;
    width: 100%;
  }

  #weather {
    position: relative;

    img {
      width: clamp(41px, 6.1vw, 50px);
      height: 24px;
    }
  }
  .header-jump {
    view-transition-name: header-jump;
    position: sticky;
    top: calc(var(--header-height) + var(--header-status-height));
    background: var(--bg);
    z-index: 3;
    container-name: header-jump;
    container-type: inline-size;
    padding: 0 2rem;
    margin: 0 -2rem;

    div {
      display: flex;
      align-items: center;
      justify-content: start;
      padding: clamp(1rem, 3.5vw, 1.5rem) 0;
      font-size: clamp(12px, 2.2vw, 20px);
      width: 100cqw;
      overflow: scroll;
      gap: 5rem;
      scroll-snap-type: x proximity;
      scroll-padding-inline-start: calc(8ch + 5rem);
    }

    .jump-to {
      white-space: nowrap;
      position: sticky;
      left: 0;
      z-index: 1;
      background: var(--bg);
      scroll-snap-align: none;
    }

    a { white-space: nowrap; scroll-snap-align: start; }
    hr { margin: 0 }
  }

  nav#mobile {
    display: flex;
    flex-direction: column;
    position: fixed;
    position-anchor: --header;
    inset: unset;
    user-select: none;
    -webkit-user-select: none;
    top: calc(anchor(bottom) - var(--header-status-height));
    left: anchor(left);
    right: anchor(right);
    width: 100%;
    margin: 0;
    padding: 0;
    border: none;
    background: var(--navy);
    overflow-x: hidden;
    overflow-y: hidden;
    max-height: 0;

    &:popover-open {
      max-height: calc(100dvh - var(--header-height) - var(--header-status-height));
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .mobile-submenu-input {
      position: fixed;
      opacity: 0;
      pointer-events: none;
      height: 0;
      width: 0;
    }

    .mobile-submenu-toggle,
    a {
      color: var(--cream);
      display: flex;
      align-items: center;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.95rem;
      min-height: 60px;
      padding: 0.9rem 2.5rem;
      width: 100%;
      gap: 0.9rem;
      border-bottom: 1px solid var(--cream-60);
      border-image: linear-gradient(to right, transparent 2.5rem, var(--cream-60) 2.5rem, var(--cream-60) calc(100% - 2.5rem), transparent calc(100% - 2.5rem)) 1;
      box-sizing: border-box;

      svg:first-of-type {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
    }

    .mobile-submenu-toggle {
      font-weight: 600;
      cursor: pointer;
      position: relative;
      user-select: none;

      svg { fill: var(--cream); }

      & > svg:last-of-type { margin-left: auto; }
    }

    .mobile-submenu-content {
      display: flex;
      flex-direction: column;
      max-height: 0;
      overflow: clip;
      opacity: 0;
    }

    .mobile-submenu-input:checked + .mobile-submenu-toggle + .mobile-submenu-content {
      max-height: 500px;
      opacity: 1;
    }

    .mobile-submenu-input:checked + .mobile-submenu-toggle > svg:last-of-type {
      transform: rotate(180deg);
    }

    a {
      background: transparent;
      flex-direction: row;
      justify-content: flex-start;
      font-weight: 600;
      position: relative;

      &:last-child { border-bottom: none; }
    }

    a .nav-icon { margin-right: 0; }

    .mobile-submenu-content a {
      font-weight: 500;
      padding-left: 3.5rem;
      border-image: linear-gradient(to right, transparent 3.5rem, var(--cream-60) 3.5rem, var(--cream-60) calc(100% - 2.5rem), transparent calc(100% - 2.5rem)) 1;
    }

    .mobile-submenu-content a:last-child { border-bottom: none; }

    > a[aria-current="page"] {
      border-left: 4px solid var(--cream);
      padding-left: calc(2.5rem - 4px);
    }

    a:has(+ a.weddings-private)::after {
      content: "";
      display: block;
      position: absolute;
      bottom: -7px;
      left: 0;
      right: 0;
      height: 0;
      border-bottom: 3px solid var(--cream-60);
      margin: 0 2.4rem;
      padding-top: 3px;
    }

    a.weddings-private {
      color: var(--pink-light);
      border-bottom: none;
      height: 6rem;

      svg { fill: var(--pink-light); }
    }
  }

  @media (max-width: 770px) {
    body:has(#mobile:popover-open) button.nav-toggle::before {
      top: 6px;
      transform: translateX(-50%) rotate(45deg);
    }

    body:has(#mobile:popover-open) button.nav-toggle::after {
      top: 6px;
      transform: translateX(-50%) rotate(-45deg);
    }
  }

  @media (max-width: 770px) {
    header > .wrapper {
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      align-items: start;

      a.logo {
        grid-column: 2;
        grid-row: 1;
        justify-self: center;
        margin: 0.75rem auto 0.5rem;
        min-width: 0;
      }

      ul.header-actions {
        grid-column: 3;
        grid-row: 1;
        display: flex;
        list-style: none;
        margin: 0.75rem 0 0 0.75rem;
        padding: 0;
        justify-self: start;
        align-items: center;

        li { display: inline-flex; }

        a, button {
          background: transparent;
          border: none;
          cursor: pointer;
          color: var(--cream);
          padding: 0;
          display: inline-flex;
          align-items: center;
        }

        svg { width: 24px; height: 24px; }
      }

      button.nav-toggle {
        grid-column: 1;
        grid-row: 1;
        position: relative;
        display: inline;
        cursor: pointer;
        background: transparent;
        border: none;
        height: 28px;
        min-width: 28px;
        margin-top: 0.8rem;
        justify-self: start;
        padding: 0;
        margin-left: 2rem;

        &::before, &::after {
          content: "";
          position: absolute;
          left: 50%;
          width: 28px;
          height: 1px;
          background: var(--cream);
          transition: transform 180ms ease, top 180ms ease;
          transform: translateX(-50%);
        }

        &::before { top: 3px; }
        &::after  { top: 15px; }
      }

      nav#desktop { display: none; }
    }
