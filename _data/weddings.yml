seo:
  title: Sedona Wedding Venues | Tlaquepaque
  description: Explore romantic Sedona wedding venues for intimate ceremonies, outdoor receptions, welcome gatherings, and private celebrations.
_info: ''
title: Distinctive Sedona Weddings
description: >-
  Located in the heart of Sedona, Tlaquepaque offers an unforgettable setting for
  intimate weddings, destination weddings, and private celebrations. Exchange vows
  in our historic wedding Chapel or celebrate beneath the stars in one of our
  romantic outdoor courtyards and terraces.
description_secondary: >-
  Vine-covered stucco walls, cobblestone walkways, graceful archways, iconic
  fountains, and towering sycamores create an enchanting backdrop for every part of
  your wedding day. With four distinctive venues for ceremonies, welcome gatherings,
  and receptions, couples can shape a celebration that feels intimate, personal, and
  distinctly Sedona.
