packages:
  eyebrow: WEDDING PACKAGES
  title: Intimate Weddings Curated For You
  hero_banner: /assets/images/weddings/packages/hero.webp
  description: >-
    From a romantic Sedona elopement to an intimate Chapel ceremony or evening
    celebration beneath the stars, Tlaquepaque offers thoughtfully curated wedding
    packages designed to simplify planning while preserving the individuality of the
    occasion.
  link:
    text: EXPLORE PACKAGES
    url: /weddings/packages/

private_tour:
  eyebrow: PRIVATE TOUR
  title: Tour the Tlaquepaque Wedding Venues
  description: >-
    The best way to understand Tlaquepaque's wedding venues is to experience them in
    person. Walk through the Chapel, courtyards, and terrace, explore the relationship
    among the spaces, and envision how your celebration could unfold throughout the
    village.
  image: /assets/images/weddings/village-map.webp
  link:
    text: SCHEDULE A TOUR
    url: '#connect'

vendors:
  eyebrow: VENDORS
  title: Tlaquepaque Wedding Vendors
  description: >-
    To help you plan a beautifully executed Sedona wedding, Tlaquepaque has assembled
    a curated network of experienced wedding vendors who understand our venues and
    event requirements. Couples are required to select their caterer, florist, and
    rental company from Tlaquepaque's approved vendor list.
  description_secondary: >-
    We also recommend trusted planners, photographers, bartenders, musicians,
    officiants, transportation providers, and other professionals who can support
    every aspect of your celebration and help create a wedding that feels seamless,
    personal, and distinctly your own.
  image: /assets/images/weddings/vendors.webp
  link:
    text: EXPLORE VENDORS
    url: /assets/files/weddings/Tlaq_Wedding_Brochure_061226_R.pdf

connect:
  eyebrow: CONNECT WITH US
  title: Begin Planning Your Wedding at Tlaquepaque
  description: >-
    Tell us about your preferred date, estimated guest count, event plans, and the
    venues that interest you. Our wedding team will answer your questions and help you
    explore the possibilities for your celebration.
  email: LAUREN@TLAQ.COM
  phone: +1 (928) 274-6762
  links:
    - text: DOWNLOAD BROCHURE
      url: /assets/files/weddings/Tlaq_Wedding_Brochure_061226_R.pdf
      external: true
    - text: EXPLORE WEDDING FAQS
      url: /wedding_faq/
